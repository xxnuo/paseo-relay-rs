name: CI
on:
  pull_request:
  push:
    branches: [main]
    tags: ['*']
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: 29.0.2
          elixir-version: 1.20.2
      - name: Elixir reference tests, release and image
        run: scripts/ci.sh
  rust-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rust checks and Linux executable
        run: |
          cargo fmt --manifest-path rust/Cargo.toml --check
          cargo clippy --locked --manifest-path rust/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path rust/Cargo.toml --all-targets
          cargo build --locked --release --manifest-path rust/Cargo.toml
      - name: Static Linux image, restart and private cluster
        run: |
          docker build -t paseo-relay-rust:local .
          cargo test --locked --manifest-path rust/Cargo.toml --test binary -- --ignored
      - name: Extract standalone Linux executable
        run: |
          image_container=$(docker create paseo-relay-rust:local)
          trap 'docker rm -f "$image_container" >/dev/null' EXIT
          mkdir -p dist
          docker cp "$image_container:/paseo-relay" dist/paseo-relay-linux-amd64
          sha256sum dist/paseo-relay-linux-amd64 > dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: paseo-relay-linux-amd64
          path: dist/
  publish:
    needs: [verify, rust-verify]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/getpaseo/paseo-relay
          tags: |
            type=raw,value=sha-${{ github.event.pull_request.head.sha || github.sha }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
          flavor: latest=false
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Record immutable image reference
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: echo "ghcr.io/getpaseo/paseo-relay@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
